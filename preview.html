<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VT HUD Preview</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    iframe { display: block; width: 100vw; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="frame" src="index.html" title="terminal preview"></iframe>
  <script>
    const frame = document.getElementById('frame');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const params = new URLSearchParams(location.search);
    const command = params.get('cmd') || 'projects';
    const openProject = params.get('open') || '';

    async function waitFor(fn, timeout = 30000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        try { if (fn()) return true; } catch (e) { /* noop */ }
        await sleep(60);
      }
      return false;
    }

    frame.addEventListener('load', async () => {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const input = d.getElementById('command-input');
      const mode = d.getElementById('status-mode');

      await waitFor(() => mode.textContent === 'READY');
      await sleep(150);

      const press = (key) => input.dispatchEvent(new w.KeyboardEvent('keydown', {
        key, bubbles: true, cancelable: true
      }));

      input.value = command;
      input.dispatchEvent(new w.Event('input', { bubbles: true }));
      press('Enter');
      await sleep(300);
      if (mode.textContent !== 'READY') press('Enter');
      await waitFor(() => mode.textContent === 'READY', 9000);
      await sleep(250);

      if (openProject) {
        const card = d.querySelector(`[data-project-open="${openProject}"]`);
        if (card) card.click();
        await waitFor(() => !d.getElementById('project-modal').hidden, 4000);
        await sleep(500);
      }

      document.title = 'READY ' + command + ' ' + openProject;
    });
  </script>
</body>
</html>
