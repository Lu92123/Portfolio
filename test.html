<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VT HUD Tests</title>
  <style>
    html, body { margin: 0; background: #000; }
    iframe { width: 1280px; height: 900px; border: 0; opacity: 0; position: fixed; left: 0; top: 0; pointer-events: none; }
    #results { position: fixed; left: 0; top: 0; color: #0f0; background: #000; font: 12px monospace; z-index: 10; white-space: pre; }
  </style>
</head>
<body>
  <iframe id="frame" src="index.html" title="terminal test"></iframe>
  <pre id="results">running…</pre>
  <script>
    const results = [];
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function record(name, ok, detail) {
      results.push({ name, ok: Boolean(ok), detail: detail === undefined ? '' : String(detail).slice(0, 240) });
    }

    async function waitFor(fn, timeout = 12000, interval = 60) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        try { if (fn()) return true; } catch (e) { /* noop */ }
        await sleep(interval);
      }
      return false;
    }

    const frame = document.getElementById('frame');
    const resultsEl = document.getElementById('results');

    frame.addEventListener('load', async () => {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const input = d.getElementById('command-input');
      const output = d.getElementById('output');
      const mode = d.getElementById('status-mode');
      const modal = d.getElementById('project-modal');

      w.addEventListener('error', (event) => record('window-error', false, event.message));
      w.console.error = (...args) => record('console-error', false, args.join(' '));
      w.console.warn = (...args) => record('console-warn', false, args.join(' '));

      const booted = await waitFor(() => mode.textContent === 'READY', 30000);
      record('boot completes', booted, mode.textContent);
      if (!booted) { finish(); return; }

      const waitReady = (timeout = 8000) => waitFor(
        () => mode.textContent === 'READY' && !input.readOnly,
        timeout,
        40
      );

      async function run(command) {
        input.value = command;
        input.dispatchEvent(new w.Event('input', { bubbles: true }));
        input.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await sleep(70);
        if (mode.textContent !== 'READY') {
          input.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        }
        return waitReady();
      }

      async function closeModal() {
        d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        await sleep(80);
      }

      async function openCard(index = 0) {
        const cards = d.querySelectorAll('.hud-open');
        if (!cards[index]) return false;
        cards[index].click();
        return waitFor(() => !modal.hidden, 2500);
      }

      const out = () => output.textContent.replace(/\s+/g, ' ');

      await run('projects');
      const cards = d.querySelectorAll('.hud-card');
      record('projects renders deck', out().includes('PROJECT DECK'), out().slice(0, 100));
      record('projects renders 3 cards', cards.length === 3, cards.length);
      record('card has media image', Boolean(cards[0] && cards[0].querySelector('.hud-media img')), '');
      record('card image path', cards[0] && cards[0].querySelector('img').getAttribute('src'), 'assets/img/first-robot.jpg');
      record('card has badges', Boolean(cards[0] && cards[0].querySelectorAll('.hud-badge').length >= 5), '');
      record('card has code + media buttons', Boolean(
        cards[0] &&
        cards[0].querySelector('[data-project-media]') &&
        cards[0].querySelector('[data-todo], a[href]')
      ), '');
      const imagesLoaded = await waitFor(() => {
        const img = cards[0] && cards[0].querySelector('img');
        return img && img.complete && img.naturalWidth > 0;
      }, 6000);
      record('placeholder image loads', imagesLoaded, cards[0] ? cards[0].querySelector('img').naturalWidth : 'no card');

      record('modal closed initially', modal.hidden, '');
      record('card click opens modal', await openCard(0), '');
      record('modal title FIRST', d.getElementById('project-modal-title').textContent.includes('FIRST'), d.getElementById('project-modal-title').textContent);
      record('modal media path', d.getElementById('modal-media-path').textContent === 'assets/img/first-robot.jpg', d.getElementById('modal-media-path').textContent);
      record('modal specs rendered', d.querySelectorAll('#modal-specs .k').length >= 4, d.querySelectorAll('#modal-specs .k').length);
      record('modal badges rendered', d.querySelectorAll('#modal-badges .hud-badge').length >= 5, '');
      record('modal has project-media img', Boolean(d.querySelector('#project-modal-media img')), '');
      record('modal focus on close', d.activeElement === d.getElementById('project-modal-close'), d.activeElement && d.activeElement.id);

      await closeModal();
      record('Escape closes modal', modal.hidden, '');

      await run('projects');
      await openCard(0);
      d.querySelector('[data-project-nav="1"]').click();
      await sleep(80);
      record('next project -> PROBOT', d.getElementById('project-modal-title').textContent.includes('PROBOT'), d.getElementById('project-modal-title').textContent);
      d.querySelector('[data-project-nav="1"]').click();
      await sleep(80);
      record('next project -> SPEEDCUBING', d.getElementById('project-modal-title').textContent.includes('SPEEDCUBING'), d.getElementById('project-modal-title').textContent);
      d.querySelector('[data-project-nav="1"]').click();
      await sleep(80);
      record('next wraps to FIRST', d.getElementById('project-modal-title').textContent.includes('FIRST'), d.getElementById('project-modal-title').textContent);
      d.querySelector('[data-project-nav="-1"]').click();
      await sleep(80);
      record('prev wraps to SPEEDCUBING', d.getElementById('project-modal-title').textContent.includes('SPEEDCUBING'), d.getElementById('project-modal-title').textContent);
      await closeModal();

      await run('projects');
      const mediaBtn = d.querySelector('.hud-card .hud-btn.primary');
      mediaBtn.click();
      await waitFor(() => !modal.hidden, 2000);
      await sleep(120);
      record('footer FOTOS/VIDEO opens modal', !modal.hidden, '');
      record('FOTOS/VIDEO focuses media', d.activeElement === d.getElementById('project-modal-media'), d.activeElement && d.activeElement.id);
      record('modal action code present', Boolean(d.querySelector('#modal-actions [data-todo], #modal-actions a[href]')), '');

      const todoBtn = d.querySelector('#modal-actions [data-todo]');
      if (todoBtn) {
        todoBtn.click();
        await sleep(150);
        record('pending action stays in modal', !modal.hidden, '');
        record('pending action shows toast', d.getElementById('toast').textContent.includes('PENDIENTE'), d.getElementById('toast').textContent);
      }
      await closeModal();

      const broken = await openCard(1);
      record('second card opens', broken, '');
      const modalImg = d.querySelector('#project-modal-media img');
      if (modalImg) {
        modalImg.src = 'assets/img/__missing__.jpg';
        const marked = await waitFor(() => {
          const frameEl = d.querySelector('#project-modal-media .media-frame');
          return frameEl && frameEl.classList.contains('media-missing');
        }, 3000);
        record('missing image fallback', marked, '');
      }
      await closeModal();

      await run('projects 2');
      record('projects 2 opens PROBOT', !modal.hidden && d.getElementById('project-modal-title').textContent.includes('PROBOT'), d.getElementById('project-modal-title').textContent);
      await closeModal();

      await run('cubing');
      record('cubing opens SPEEDCUBING', !modal.hidden && d.getElementById('project-modal-title').textContent.includes('SPEEDCUBING'), d.getElementById('project-modal-title').textContent);
      record('cubing shows WCA action', out().includes('PERFIL WCA') || Boolean(d.querySelector('#modal-actions [data-todo="cubingWca"]')), '');
      await closeModal();

      await run('help');
      record('help still works', out().includes('COMANDOS DISPONIBLES'), '');
      await run('about');
      record('about still works', out().includes('PERFIL / OPERADOR'), '');
      await run('theme green');
      record('theme green works', d.documentElement.getAttribute('data-theme') === 'green', d.documentElement.getAttribute('data-theme'));
      await run('crt off');
      record('crt off works', d.documentElement.classList.contains('crt-off'), '');
      await run('crt on');
      record('crt on works', !d.documentElement.classList.contains('crt-off'), '');
      await run('theme amber');

      await run('projects 9');
      record('invalid project index handled', out().includes('índice desconocido'), '');
      await run('echo hud');
      record('echo still works', out().includes('hud'), '');
      await run('clear');
      record('clear empties output', output.textContent.trim() === '', output.textContent.slice(0, 40));

      await run('projects');
      await openCard(0);
      record('card click after clear works', !modal.hidden, '');
      await closeModal();

      record('no modal left open at end', modal.hidden, '');
      record('no horizontal overflow', d.documentElement.scrollWidth <= w.innerWidth + 1, `${d.documentElement.scrollWidth}/${w.innerWidth}`);

      finish();

      function finish() {
        const failed = results.filter((r) => !r.ok);
        resultsEl.textContent = JSON.stringify({
          total: results.length,
          failed: failed.length,
          failures: failed,
          results
        }, null, 2);
        document.title = failed.length ? `FAIL ${failed.length}` : `PASS ${results.length}`;
      }
    });
  </script>
</body>
</html>
