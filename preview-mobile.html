<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VT HUD Mobile Preview</title>
  <style>
    html, body { margin: 0; background: #141414; overflow: hidden; }
    iframe { display: block; width: 390px; height: 844px; border: 0; margin: 0 auto; }
  </style>
</head>
<body>
  <iframe id="frame" src="index.html" title="terminal mobile preview"></iframe>
  <script>
    const frame = document.getElementById('frame');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const params = new URLSearchParams(location.search);
    const command = params.get('cmd') || '';
    const openProject = params.get('open') || '';

    async function waitFor(fn, timeout = 30000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        try { if (fn()) return true; } catch (e) { /* noop */ }
        await sleep(60);
      }
      return false;
    }

    frame.addEventListener('load', async () => {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const input = d.getElementById('command-input');
      const mode = d.getElementById('status-mode');

      await waitFor(() => mode.textContent === 'READY');
      await sleep(150);

      if (command) {
        input.value = command;
        input.dispatchEvent(new w.Event('input', { bubbles: true }));
        input.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await sleep(300);
        if (mode.textContent !== 'READY') {
          input.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        }
        await waitFor(() => mode.textContent === 'READY', 9000);
        await sleep(250);
      }

      if (openProject) {
        const card = d.querySelector(`[data-project-open="${openProject}"]`);
        if (card) card.click();
        await waitFor(() => !d.getElementById('project-modal').hidden, 4000);
        await sleep(500);
      }

      document.title = 'READY';
    });
  </script>
</body>
</html>
